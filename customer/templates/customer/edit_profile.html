<!DOCTYPE html>
<html>
<head>
    <title>Edit Profile</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{
            background:#f4f6f9;
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
        }

        .container{
            width:500px;
            background:white;
            padding:35px;
            border-radius:15px;
            box-shadow:0 5px 20px rgba(0,0,0,0.1);
        }

        h1{
            text-align:center;
            color:#333;
            margin-bottom:25px;
        }

        .profile-info{
            margin-bottom:20px;
        }

        label{
            display:block;
            margin-bottom:5px;
            color:#555;
            font-weight:bold;
        }

        input{
            width:100%;
            padding:10px;
            border:1px solid #ddd;
            border-radius:8px;
            margin-bottom:15px;
        }

        button{
            width:100%;
            background:#2563eb;
            color:white;
            border:none;
            padding:12px;
            border-radius:8px;
            cursor:pointer;
            font-size:15px;
            font-weight:bold;
        }

        button:hover{
            background:#1d4ed8;
        }

        .back{
            display:block;
            text-align:center;
            margin-top:15px;
            text-decoration:none;
            color:#666;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Edit Profile</h1>

    <form>

        <label>Username</label>
        <input type="text" value="{{ request.user.username }}" readonly>

        <label>Email</label>
        <input type="email" placeholder="Enter email">

        <label>Full Name</label>
        <input type="text" placeholder="Enter full name">

        <button type="button">
            Update Profile
        </button>

    </form>

    <a href="/customer/home/" class="back">
        ← Back to Home
    </a>

</div>

</body>
</html>
