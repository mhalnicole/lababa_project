<!DOCTYPE html>
<html>
<head>
    <title>View Customer Ratings</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Inter', sans-serif;
        }

        body{
            background:#f4f6f9;
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            padding:20px;
        }

        .container{
            width:900px;
            background:white;
            padding:40px;
            border-radius:18px;
            box-shadow:0 10px 25px rgba(0,0,0,0.08);
        }

        h1{
            text-align:center;
            color:#1f2937;
            margin-bottom:10px;
        }

        .subtitle{
            text-align:center;
            color:#6b7280;
            margin-bottom:30px;
        }

        table{
            width:100%;
            border-collapse:collapse;
        }

        th{
            background:#2563eb;
            color:white;
            padding:14px;
            text-align:left;
        }

        td{
            padding:14px;
            border-bottom:1px solid #e5e7eb;
        }

        tr:hover{
            background:#f9fafb;
        }

        .links{
            margin-top:25px;
            display:flex;
            justify-content:space-between;
        }

        .link{
            text-decoration:none;
            color:#9ca3af;
        }

        .link:hover{
            color:#6b7280;
        }

    </style>
</head>

<body>

<div class="container">

    <h1>Customer Ratings</h1>
    <table>

        <tr>
            <th>Customer Name</th>
            <th>Rating</th>
            <th>Feedback</th>
        </tr>

        {% for rating in ratings %}
        <tr>
            <td>{{ rating.customer }}</td>
            <td>{{ rating.score }}/5</td>
            <td>{{ rating.feedback }}</td>
        </tr>
        {% endfor %}

    </table>

    <div class="links">

        <a href="/customer/home/" class="link">
            ← Customer Module
        </a>

        <a href="/customer/lababa-home/" class="link">
            LABABA Dashboard
        </a>

    </div>

</div>

</body>
</html>
