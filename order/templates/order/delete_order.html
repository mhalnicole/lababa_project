<!DOCTYPE html>
<html>
<head>
    <title>Delete Order</title>
</head>
<body>
    <h1>Delete Order</h1>

    <p>Are you sure you want to delete this order?</p>
    <p><strong>{{ order.order_id }}</strong> - {{ order.customer_name }}</p>

    <form method="POST">
        {% csrf_token %}
        <button type="submit">Yes, Delete</button>
    </form>

    <br>
    <a href="{% url 'order_list' %}">Cancel</a>
</body>
</html>
