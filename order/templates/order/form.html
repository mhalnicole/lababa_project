<!DOCTYPE html>
<html>
<head>
    <title>Add New Order</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #74ebd5, #9face6);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .form-card {
            background: white;
            width: 520px;
            padding: 35px;
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
        }

        .form-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .form-header .icon {
            font-size: 45px;
            margin-bottom: 10px;
        }

        .form-header h2 {
            margin: 0;
            color: #333;
            font-size: 30px;
        }

        .form-header p {
            color: #666;
            margin-top: 10px;
            font-size: 15px;
        }

        form p {
            margin-bottom: 18px;
        }

        form label {
            display: block;
            font-weight: bold;
            color: #444;
            margin-bottom: 7px;
        }

        form input,
        form select,
        form textarea {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #ddd;
            border-radius: 12px;
            font-size: 15px;
            box-sizing: border-box;
            outline: none;
            transition: 0.3s ease;
        }

        form input:focus,
        form select:focus,
        form textarea:focus {
            border-color: #5b86e5;
            box-shadow: 0 0 0 3px rgba(91, 134, 229, 0.15);
        }

        .button-row {
            display: flex;
            gap: 12px;
            margin-top: 25px;
        }

        .submit-btn,
        .back-btn {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 15px;
            font-size: 16px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            transition: 0.3s ease;
        }

        .submit-btn {
            background: linear-gradient(135deg, #11998e, #38ef7d);
        }

        .back-btn {
            background: linear-gradient(135deg, #36d1dc, #5b86e5);
        }

        .submit-btn:hover,
        .back-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.25);
        }

        .errorlist {
            color: #ff416c;
            font-size: 14px;
            margin-bottom: 8px;
            padding-left: 18px;
        }

        .helptext {
            display: block;
            color: #888;
            font-size: 13px;
            margin-top: 5px;
        }
    </style>
</head>
<body>

<div class="form-card">
    <div class="form-header">
        <div class="icon"></div>
        <h2>Add New Order</h2>
        <p>Fill in the order details below.</p>
    </div>

    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}

        <div class="button-row">
            <button type="submit" class="submit-btn"> Submit Order</button>

            <a href="{% url 'order_home' %}" class="back-btn">
                Back to Menu
            </a>
        </div>
    </form>
</div>

</body>
</html>
