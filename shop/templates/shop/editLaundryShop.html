<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Laundry Shop - LABABA</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background-color: #0a0e1a;
            color: #e0e6f0;
            min-height: 100vh;
            background-image:
                radial-gradient(ellipse at 20% 0%, rgba(30, 80, 180, 0.15) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 100%, rgba(10, 40, 120, 0.2) 0%, transparent 60%);
        }

        header {
            background: linear-gradient(135deg, #0d1b3e, #112255);
            border-bottom: 1px solid rgba(100, 160, 255, 0.15);
            padding: 18px 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo { font-size: 22px; font-weight: 700; letter-spacing: 4px; color: #ffffff; }
        .logo span { color: #4a9eff; }

        .back-btn {
            text-decoration: none;
            font-size: 12px;
            font-weight: 600;
            color: #3a5a8a;
            border: 1px solid rgba(74, 158, 255, 0.2);
            padding: 7px 16px;
            border-radius: 6px;
            transition: all 0.2s;
        }

        .back-btn:hover { color: #4a9eff; border-color: #4a9eff; }

        .container { width: 90%; max-width: 560px; margin: 50px auto; }

        .page-tag { font-size: 11px; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; color: #4a9eff; margin-bottom: 10px; }
        h2 { font-size: 28px; font-weight: 700; color: #c8d8f0; margin-bottom: 6px; }
        .sub { font-size: 13px; color: #3a5a8a; margin-bottom: 30px; }

        .form-card {
            background: linear-gradient(145deg, #0d1b3e, #0a1530);
            border: 1px solid rgba(74, 158, 255, 0.12);
            border-radius: 12px;
            padding: 32px;
            position: relative;
            overflow: hidden;
        }

        .form-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2px;
            background: linear-gradient(90deg, #4a9eff, #1a5fd4);
        }

        .form-card p { margin-bottom: 18px; }

        .form-card label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #4a9eff;
            margin-bottom: 8px;
        }

        .form-card input[type="text"],
        .form-card input[type="number"],
        .form-card textarea,
        .form-card select {
            width: 100%;
            padding: 12px 16px;
            background: #060d1e;
            border: 1px solid rgba(74, 158, 255, 0.2);
            border-radius: 8px;
            color: #e0e6f0;
            font-family: "Segoe UI", Arial, sans-serif;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-card input:focus,
        .form-card textarea:focus,
        .form-card select:focus {
            border-color: #4a9eff;
            box-shadow: 0 0 0 3px rgba(74, 158, 255, 0.1);
        }

        .form-actions {
            display: flex;
            gap: 12px;
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid rgba(74, 158, 255, 0.1);
        }

        .btn {
            display: inline-block;
            text-decoration: none;
            font-size: 12px;
            font-weight: 600;
            padding: 11px 24px;
            border-radius: 6px;
            cursor: pointer;
            border: none;
            font-family: "Segoe UI", Arial, sans-serif;
            transition: all 0.2s;
        }

        .btn-primary { background: #1a5fd4; color: white; flex: 1; }
        .btn-primary:hover { background: #4a9eff; }

        .btn-secondary { background: transparent; border: 1px solid rgba(74, 158, 255, 0.2); color: #3a5a8a; }
        .btn-secondary:hover { border-color: #4a9eff; color: #4a9eff; }
    </style>
</head>
<body>

<header>
    <div class="logo">LA<span>BABA</span></div>
    <a href="/shop/" class="back-btn">← Back to Shop</a>
</header>

<div class="container">
    <div class="page-tag">Edit Record</div>
    <h2>Edit Laundry Shop</h2>
    <div class="sub">Update the details for {{ shop.shop_name }}.</div>

    <div class="form-card">
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <div class="form-actions">
                <a href="/shop/" class="btn btn-secondary">Cancel</a>
                <button type="submit" class="btn btn-primary">Save Changes</button>
            </div>
        </form>
    </div>
</div>

</body>
</html>
